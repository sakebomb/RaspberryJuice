name: Feature request
description: Suggest an enhancement or new command
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? If it's a new socket command, sketch its name and arguments.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.
  - type: checkboxes
    id: protocol
    attributes:
      label: Protocol impact
      options:
        - label: This change preserves the existing mcpi wire protocol (does not change numeric ids or existing command formats)
