version: 2
updates:
  # Maven dependencies (the plugin)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Python client dependencies
  - package-ecosystem: pip
    directory: "/client"
    schedule:
      interval: weekly
