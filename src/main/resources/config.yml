# default config.yml

# The host name and port to listen on.
#
# hostname - the address to bind the API socket to. This socket is UNAUTHENTICATED
#            and UNENCRYPTED: anyone who can reach it can place/destroy blocks,
#            teleport players and spawn entities. It now defaults to "localhost"
#            (loopback only) so it is safe out of the box.
#            Set it to "0.0.0.0" to accept connections from ANY host on the network
#            (the old default) - only do this on a trusted/firewalled network.
hostname: localhost
port: 4711

# Determine whether locations are RELATIVE to the spawn point (default like pi) or ABSOLUTE
location: RELATIVE

# Determine whether hit events are triggered by LEFT clicks, RIGHT clicks or BOTH
hitclick: RIGHT

# Whether to broadcast a "Welcome <player>" message to everyone when a player joins.
# Set to false to keep this scripting bridge silent on join.
welcome-message: true

# Whether the "op-like" commands that grant power to the current player are allowed:
# player.setGameMode and player.give. Handy for a STEM sandbox (default true); set false on a
# shared/survival server so a socket client can't self-grant creative mode or items.
enable-op-commands: true

# Optional shared secret. When set (non-empty), a client must authenticate before any other
# command by sending  auth(<token>)  - all other commands answer "Fail" until it does, and the
# connection is dropped after a few bad attempts. Empty (default) = no authentication.
# NOTE: the socket is NOT encrypted, so this token protects against unauthorized connections,
# not against sniffing on an untrusted network - tunnel the port (Tailscale/SSH/stunnel) for
# confidentiality. See SECURITY.md.
auth-token: ''

# Maximum number of blocks a single world.getBlocks / world.setBlocks request may span.
# Guards against a client freezing or OOM-ing the server with a huge cuboid (the work runs
# on the main server thread). Oversized requests are rejected with "Fail". 0 disables the cap.
max-blocks: 1000000

# Cumulative blocks that ALL cuboid ops (world.getBlocks / setBlocks / clone) may touch in a
# single server tick. max-blocks caps one request, but a tick processes up to 9000 commands -
# so without this a client could stack thousands of near-cap requests and iterate/allocate tens
# of GB in one tick. Requests are rejected once the tick's running total would exceed this.
# 0 disables the per-tick budget (not recommended - leaves the server open to that flood).
max-blocks-per-tick: 10000000
