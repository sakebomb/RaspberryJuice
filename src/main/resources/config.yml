# default config.yml

# The host name and port to listen on.
#
# hostname - the address to bind the API socket to. This socket is UNAUTHENTICATED
#            and UNENCRYPTED: anyone who can reach it can place/destroy blocks,
#            teleport players and spawn entities. It now defaults to "localhost"
#            (loopback only) so it is safe out of the box.
#            Set it to "0.0.0.0" to accept connections from ANY host on the network
#            (the old default) - only do this on a trusted/firewalled network.
hostname: localhost
port: 4711

# Determine whether locations are RELATIVE to the spawn point (default like pi) or ABSOLUTE
location: RELATIVE

# Determine whether hit events are triggered by LEFT clicks, RIGHT clicks or BOTH
hitclick: RIGHT

# Whether to broadcast a "Welcome <player>" message to everyone when a player joins.
# Set to false to keep this scripting bridge silent on join.
welcome-message: true

# Whether the "op-like" commands that grant power to the current player are allowed:
# player.setGameMode and player.give. Handy for a STEM sandbox (default true); set false on a
# shared/survival server so a socket client can't self-grant creative mode or items.
enable-op-commands: true

# Whether the reactive event streams (events.player.moves / block.breaks / block.places /
# player.deaths) report EVERY player's activity to every connected socket. That is effectively a
# live player-tracking feed, so it defaults to false: each session sees only its OWN player's
# events (the session's attached player, or the host player for a headless script). Set true only
# on a trusted, single-user server where you want whole-world / region triggers that fire on any
# player's actions.
allow-global-events: false

# Optional shared secret. When set (non-empty), a client must authenticate before any other
# command by sending  auth(<token>)  - all other commands answer "Fail" until it does, and the
# connection is dropped after a few bad attempts. Empty (default) = no authentication.
# NOTE: the socket is NOT encrypted, so this token protects against unauthorized connections,
# not against sniffing on an untrusted network - tunnel the port (Tailscale/SSH/stunnel) for
# confidentiality. See SECURITY.md.
auth-token: ''

# Optional per-player bind secrets. auth-token controls WHO may connect; player-tokens controls
# WHICH player a connection may bind to via setPlayer - and therefore whose reactive event feed
# (moves/deaths/block breaks+places) it may observe. Leave EMPTY (default) and setPlayer(<name>)
# binds by name with no token, as before - right for single-user / trusted servers.
#
# Set one entry per player (name: secret) to enforce authorization. Once this map is non-empty,
# setPlayer is FAIL-CLOSED: a client must send setPlayer(<name>,<token>) and it succeeds only if
# that player is listed AND the token matches. An unlisted player, a wrong token, or a missing
# token all get "Fail" and bind to nobody. Hand each user only their own player's token so a
# connection can observe only the player it owns. NOTE: the socket is not encrypted, so these
# tokens (like auth-token) protect against unauthorized binding, not sniffing - tunnel the port.
# Avoid commas in tokens: command arguments are split on commas and not escaped.
player-tokens: {}
# Example:
# player-tokens:
#   Alice: alice-long-random-secret
#   Bob: bob-long-random-secret

# Per-student build plots. EMPTY (default) = no spatial sandbox, same as today.
# A non-empty map turns the sandbox ON and fail-closed: a session may read or write
# coordinates only inside the plot of the player it bound with setPlayer. An unbound
# session, or a bound player with no entry, cannot mutate the world or read coordinates
# through the socket, and it no longer falls through to the host player.
#
# Coordinates are in the SAME space as `location` above — the numbers a client passes
# to world.setBlock. They are NOT always F3 world coordinates.
#   location RELATIVE (default): 0,0,0 is the world spawn BLOCK.
#   location ABSOLUTE: the numbers are world block coordinates.
# Each entry is six integers: minX,minY,minZ,maxX,maxY,maxZ (inclusive). Corners may
# be listed in either order. Overlapping plots are logged; both students can write the
# shared cells, and /rj reset of either plot (a later change) wipes those cells.
# A gap under 2 blocks is logged as a piston warning, not a water warning. Water reaches
# seven blocks from a source, so keep eight blocks between plot edges.
# Player names must not contain a comma or a pipe.
# A present value that is not a map turns the sandbox on with nobody plotted.
# Bukkit does not add this key to an existing config.yml; paste it in.
plots: {}
# Example, RELATIVE to spawn. Two 32x16x32 pads with a 16-block gap along X.
# plots:
#   Alice: [0, 0, 0, 31, 15, 31]
#   Bob: [48, 0, 0, 79, 15, 31]

# While the sandbox is enabled, reject world.setTime and world.setWeather (they change
# the world for every student). Ignored when plots is empty. Set false for a lesson
# about the clock or the weather.
sandbox-lock-world-rules: true

# Maximum number of blocks a single world.getBlocks / world.setBlocks request may span.
# Guards against a client freezing or OOM-ing the server with a huge cuboid (the work runs
# on the main server thread). Oversized requests are rejected with "Fail". 0 disables the cap.
max-blocks: 1000000

# Cumulative blocks that ALL cuboid ops (world.getBlocks / setBlocks / clone) may touch in a
# single server tick. max-blocks caps one request, but a tick processes up to 9000 commands -
# so without this a client could stack thousands of near-cap requests and iterate/allocate tens
# of GB in one tick. Requests are rejected once the tick's running total would exceed this.
# 0 disables the per-tick budget (not recommended - leaves the server open to that flood).
max-blocks-per-tick: 10000000

# Distinct chunk columns (16x16) one socket session may touch in a single server tick via
# coordinate commands (getBlock/setBlock/getBlocks/getHeight/spawnEntity/teleport/…). A tick
# drains thousands of commands, so without this a client can force-generate a new chunk per
# command at arbitrary far coordinates — main-thread stalls plus unbounded region-file growth.
# Already-touched chunks in the same tick are free; a cuboid that spans more chunks than this
# is rejected whole. This rates generation, it does not cap eventual world size (later ticks
# can still generate more). 0 disables the cap.
max-chunks-per-tick: 256

# Maximum number of concurrent socket sessions. Each connection spends two server threads, so an
# unbounded connection flood is a resource-exhaustion DoS. New connections beyond this are refused
# and closed immediately. Raise it for a large classroom; 0 disables the cap.
max-sessions: 100

# Maximum entities one socket session may spawn via world.spawnEntity over the life of the
# connection. A tick drains thousands of commands, so without this a client can grow the world's
# live entity count until the server stalls. This is a lifetime spawn count (removeEntity does
# not free a slot; reconnecting starts a new quota). Oversized spawns are rejected with "Fail"
# — spawnEntity is request-response, so staying silent would desync the client. 0 disables the cap.
max-entities-per-session: 1000

# Maximum NEW connections one remote IP may open per minute. Bounds connection-flood churn and
# slows token brute-forcing: the auth / setPlayer lockouts close a connection after 3 bad guesses,
# but without this an attacker just reconnects for another 3 with no cooldown. Excess connections
# from an IP are refused and closed. 0 disables per-IP rate limiting.
max-connections-per-minute: 60
