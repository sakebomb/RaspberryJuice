author: Zhuowei
api-version: '1.21'
database: false
description: Implementation of the Minecraft PI modding API
main: net.zhuoweizhang.raspberryjuice.RaspberryJuicePlugin
name: RaspberryJuice
load: POSTWORLD
version: '2.1.1'
commands:
  rj:
    description: Freeze, unfreeze, or reset a student's plot. Reset sets the plot to air, including any overlap. There is no undo.
    usage: /rj <freeze|unfreeze|reset> <player>
    permission: raspberryjuice.classroom.teacher
permissions:
  raspberryjuice.classroom.teacher:
    description: Build inside any student plot, and use /rj freeze, unfreeze, and reset
    default: op
